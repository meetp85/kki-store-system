<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KKI Stores — Digital Store Management System</title>

<!-- PWA: makes the app installable to a phone's home screen -->
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#12151B">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
<!-- iOS-specific "Add to Home Screen" support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KKI Stores">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#F3F4F1;
    --surface:#FFFFFF;
    --ink:#191D23;
    --ink-soft:#5B6472;
    --ink-faint:#8B93A1;
    --sidebar:#12151B;
    --sidebar-ink:#B9C2CF;
    --sidebar-ink-dim:#6E7787;
    --accent:#C98A1D;
    --accent-strong:#A66E13;
    --accent-tint:#FBF0DC;
    --line:#E3E4E0;
    --line-soft:#EDEEEB;
    --good:#2F8F5B; --good-tint:#E7F5EE;
    --warn:#C98A1D; --warn-tint:#FBF0DC;
    --danger:#C0392B; --danger-tint:#FBEAE8;
    --info:#2F6FA8; --info-tint:#E9F1F8;
    --grey:#5B6472; --grey-tint:#EEEFEC;
    --radius:8px;
    --shadow:0 1px 2px rgba(20,20,20,.05), 0 4px 14px rgba(20,20,20,.04);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; font-size:14px;}
  h1,h2,h3,h4{font-family:'IBM Plex Sans',sans-serif; margin:0; letter-spacing:-.01em;}
  code,.mono,.ident{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#D5D6D1;border-radius:4px;}

  #app{display:flex; height:100vh; overflow:hidden;}

  /* SIDEBAR */
  #sidebar{width:238px; flex:0 0 238px; background:var(--sidebar); color:var(--sidebar-ink);
    display:flex; flex-direction:column; overflow-y:auto;}
  .brand{padding:20px 18px 14px; border-bottom:1px solid #232833;}
  .brand .name{font-family:'IBM Plex Sans'; font-weight:700; font-size:15px; color:#fff; letter-spacing:.02em;}
  .brand .sub{font-family:'IBM Plex Mono'; font-size:10.5px; color:var(--accent); margin-top:3px; letter-spacing:.08em;}
  .brand .doc{font-size:10px; color:var(--sidebar-ink-dim); margin-top:6px;}
  nav{padding:10px 8px; flex:1;}
  .nav-group{margin-bottom:4px;}
  .nav-title{font-size:10px; text-transform:uppercase; letter-spacing:.09em; color:var(--sidebar-ink-dim);
    padding:12px 10px 4px;}
  .nav-item{display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:6px; cursor:pointer;
    color:var(--sidebar-ink); font-size:13px; font-weight:500; margin-bottom:1px; transition:background .12s;}
  .nav-item:hover{background:#1D222B;}
  .nav-item.active{background:var(--accent); color:#1A1300;}
  .nav-item .ic{width:16px; text-align:center; font-size:13px; opacity:.9;}
  .nav-badge{margin-left:auto; background:var(--danger); color:#fff; font-size:10px; font-weight:700;
    padding:1px 6px; border-radius:10px; min-width:16px; text-align:center;}
  .nav-item.active .nav-badge{background:#1A1300; color:var(--accent);}
  .sidebar-foot{padding:12px 16px; border-top:1px solid #232833; font-size:10.5px; color:var(--sidebar-ink-dim);}

  /* MAIN */
  #main{flex:1; overflow-y:auto; padding:26px 32px 60px;}
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;}
  .topbar h1{font-size:20px; font-weight:700;}
  .topbar .desc{color:var(--ink-soft); font-size:12.5px; margin-top:3px;}
  .btn{display:inline-flex; align-items:center; gap:6px; background:var(--ink); color:#fff; border:none;
    padding:8px 14px; border-radius:7px; font-size:13px; font-weight:600; cursor:pointer; transition:opacity .1s;}
  .btn:hover{opacity:.85;}
  .btn.primary{background:var(--accent); color:#241900;}

  .landing-btn{width:100%; display:flex; align-items:center; gap:14px; text-align:left; cursor:pointer;
    background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:12px;
    font-family:inherit;}
  .landing-btn:hover{border-color:var(--accent);}
  .landing-btn .ic{font-size:24px; color:var(--accent); flex:0 0 auto;}
  .landing-btn .t{display:block; font-weight:600; font-size:14.5px; color:var(--ink);}
  .landing-btn .s{display:block; font-size:11.5px; color:var(--ink-faint); margin-top:2px;}
  .btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line); font-weight:500;}
  .btn.ghost:hover{background:var(--grey-tint); opacity:1;}
  .btn.sm{padding:5px 10px; font-size:12px; border-radius:6px;}
  .btn.danger{background:var(--danger); color:#fff;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}

  /* CARDS / GRID */
  .grid{display:grid; gap:14px;}
  .cards4{grid-template-columns:repeat(4,1fr);}
  .cards3{grid-template-columns:repeat(3,1fr);}
  .cards2{grid-template-columns:repeat(2,1fr);}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow);}
  .stat{display:flex; flex-direction:column; gap:6px;}
  .stat .label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:600;}
  .stat .value{font-size:28px; font-weight:700; font-family:'IBM Plex Sans'; line-height:1;}
  .stat .value.good{color:var(--good);} .stat .value.warn{color:var(--warn);} .stat .value.danger{color:var(--danger);}
  .panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:18px;}
  .panel-head{display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--line-soft);}
  .panel-head h3{font-size:14px; font-weight:700;}
  .panel-body{padding:14px 18px;}

  /* TABLE */
  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint);
    font-weight:700; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap;}
  tbody td{padding:9px 10px; border-bottom:1px solid var(--line-soft); vertical-align:middle;}
  tbody tr:hover{background:#FAFAF8;}
  tbody tr:last-child td{border-bottom:none;}
  .num{text-align:right; font-variant-numeric:tabular-nums;}
  .empty-row td{text-align:center; color:var(--ink-faint); padding:26px; font-style:italic;}

  /* TAGS / BADGES */
  .tag{display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:700;}
  .tag.green{background:var(--good-tint); color:var(--good);}
  .tag.yellow{background:var(--warn-tint); color:var(--warn);}
  .tag.red{background:var(--danger-tint); color:var(--danger);}
  .tag.blue{background:var(--info-tint); color:var(--info);}
  .tag.white{background:var(--grey-tint); color:var(--grey); border:1px solid var(--line);}
  .dot{width:7px; height:7px; border-radius:50%; display:inline-block;}
  .dot.green{background:var(--good);} .dot.yellow{background:var(--warn);} .dot.red{background:var(--danger);}
  .dot.blue{background:var(--info);} .dot.white{background:#B9BEB5;}

  .ident-badge{font-family:'IBM Plex Mono'; font-weight:700; font-size:12px; background:#12151B; color:#F2CE8C;
    padding:3px 8px; border-radius:5px; letter-spacing:.02em; display:inline-block;}

  .pill{font-size:11px; font-weight:600; padding:2px 9px; border-radius:20px; background:var(--grey-tint); color:var(--ink-soft);}
  .pill.pending{background:var(--warn-tint); color:var(--warn);}
  .pill.approved{background:var(--info-tint); color:var(--info);}
  .pill.issued, .pill.completed, .pill.done{background:var(--good-tint); color:var(--good);}
  .pill.rejected{background:var(--danger-tint); color:var(--danger);}

  /* FORMS / MODAL */
  .overlay{position:fixed; inset:0; background:rgba(15,17,20,.5); display:flex; align-items:flex-start;
    justify-content:center; padding:40px 20px; overflow-y:auto; z-index:100;}
  .modal{background:#fff; border-radius:12px; width:100%; max-width:640px; box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 22px; border-bottom:1px solid var(--line);}
  .modal-head h3{font-size:15px; font-weight:700;}
  .modal-close{cursor:pointer; color:var(--ink-faint); font-size:20px; border:none; background:none; line-height:1;}
  .modal-body{padding:20px 22px; max-height:70vh; overflow-y:auto;}
  .modal-foot{display:flex; justify-content:flex-end; gap:8px; padding:14px 22px; border-top:1px solid var(--line);}
  .field{margin-bottom:13px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
  .field .hint{font-size:11px; color:var(--ink-faint); margin-top:4px;}
  .field input, .field select, .field textarea{width:100%; padding:8px 10px; border:1px solid var(--line);
    border-radius:6px; font-size:13px; font-family:inherit; background:#fff; color:var(--ink);}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--accent);}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .field-row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}
  .radio-group{display:flex; gap:14px; flex-wrap:wrap;}
  .radio-group label{display:flex; align-items:center; gap:6px; font-size:13px; font-weight:500; color:var(--ink);}
  .item-rows{border:1px solid var(--line); border-radius:8px; overflow:hidden; margin-bottom:8px;}
  .item-rows .irow{display:grid; grid-template-columns:2fr 1fr 1fr 32px; gap:8px; padding:8px; border-bottom:1px solid var(--line-soft); align-items:center;}
  .item-rows .irow:last-child{border-bottom:none;}
  .irow input, .irow select{padding:6px 8px; font-size:12.5px;}
  .rm-row{background:none; border:none; color:var(--danger); cursor:pointer; font-size:15px;}
  #notifBellBtn.active-bell{background:rgba(184,134,11,.15); color:var(--accent) !important; border-color:var(--accent) !important;}
  .so-item-rows{border:1px solid var(--line); border-radius:8px; overflow:hidden; margin-bottom:8px;}
  .so-item-rows .irow{display:grid; grid-template-columns:2fr .8fr .8fr .7fr .9fr 28px; gap:8px; padding:8px;
    border-bottom:1px solid var(--line-soft); align-items:center;}
  .so-item-rows .irow:last-child{border-bottom:none;}

  .search-bar{display:flex; gap:8px; margin-bottom:14px;}
  .search-bar input{flex:1; padding:8px 12px; border:1px solid var(--line); border-radius:7px; font-size:13px;}
  select.filter{padding:8px 10px; border:1px solid var(--line); border-radius:7px; font-size:13px; background:#fff;}

  .alert-list{display:flex; flex-direction:column; gap:8px;}
  .alert-item{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; font-size:13px; border:1px solid var(--line-soft);}
  .alert-item.danger{background:var(--danger-tint); border-color:#F0CFC9;}
  .alert-item.warn{background:var(--warn-tint); border-color:#F0DCB1;}
  .alert-item .ic{font-size:15px;}
  .alert-item b{font-weight:700;}
  .muted{color:var(--ink-faint);}
  .flow-chip{display:inline-flex; align-items:center; gap:6px; background:var(--grey-tint); border:1px solid var(--line);
    padding:6px 12px; border-radius:20px; font-size:12px; font-weight:600;}
  .flow-arrow{color:var(--ink-faint); font-size:14px;}
  .flow-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:10px 0;}

  .toast{position:fixed; bottom:22px; right:22px; background:var(--ink); color:#fff; padding:11px 18px;
    border-radius:8px; font-size:13px; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,.25); z-index:200; opacity:0; transform:translateY(8px); transition:all .25s;}
  .toast.show{opacity:1; transform:translateY(0);}

  .kv{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:13px;}
  .kv .k{color:var(--ink-faint); font-weight:500;}
  .kv .v{font-weight:600;}

  .tab-strip{display:flex; gap:4px; margin-bottom:16px; border-bottom:1px solid var(--line); flex-wrap:wrap;}
  .tab-btn{padding:9px 14px; font-size:12.5px; font-weight:600; color:var(--ink-soft); background:none; border:none;
    cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;}
  .tab-btn.active{color:var(--accent-strong); border-bottom-color:var(--accent);}

  .link-btn{background:none; border:none; color:var(--info); cursor:pointer; font-weight:600; font-size:12.5px; padding:0;}
  .icon-btn{background:none; border:none; cursor:pointer; color:var(--ink-faint); font-size:14px; padding:3px 5px; border-radius:4px;}
  .icon-btn:hover{background:var(--grey-tint); color:var(--ink);}

  /* MOBILE / RESPONSIVE */
  .mobile-menu-btn{display:none; position:fixed; top:12px; left:12px; z-index:70; background:var(--sidebar);
    color:#fff; border:none; width:40px; height:40px; border-radius:9px; font-size:18px; align-items:center;
    justify-content:center; box-shadow:var(--shadow); cursor:pointer;}
  .mobile-menu-btn.hide{display:none !important;}
  .sidebar-backdrop{display:none; position:fixed; inset:0; background:rgba(10,10,10,.5); z-index:64;}
  .sidebar-backdrop.open{display:block;}

  @media (max-width: 860px){
    .mobile-menu-btn{display:flex;}
    #sidebar{position:fixed; top:0; left:0; height:100vh; z-index:65; width:250px; flex:0 0 250px;
      transform:translateX(-100%); transition:transform .22s ease; box-shadow:3px 0 20px rgba(0,0,0,.28);}
    #sidebar.open{transform:translateX(0);}
    #main{padding:64px 14px 50px; width:100%;}
    .cards4,.cards3,.cards2{grid-template-columns:repeat(2,1fr);}
    .topbar{flex-direction:column; align-items:flex-start; gap:10px;}
    .topbar > div:last-child{display:flex; flex-wrap:wrap; gap:8px;}
    .panel-body{overflow-x:auto; -webkit-overflow-scrolling:touch;}
    table{min-width:640px;}
    .modal{width:94vw !important; max-width:94vw !important;}
    .field-row,.field-row3{grid-template-columns:1fr !important;}
  }
  @media (max-width: 480px){
    .cards4,.cards3,.cards2{grid-template-columns:1fr;}
    #main{padding:60px 10px 50px;}
  }

  .print-only{display:none;}
  @media print{
    #sidebar,.topbar .btn,.no-print,.mobile-menu-btn{display:none !important;}
    #main{padding:0; overflow:visible;}
    body{background:#fff;}
    .print-only{display:block;}
  }
  .loading-screen{display:flex; align-items:center; justify-content:center; height:100vh; width:100vw; background:var(--bg); color:var(--ink-soft); font-family:'IBM Plex Mono';}
  .empty-state{text-align:center; padding:50px 20px; color:var(--ink-faint);}
  .empty-state .big{font-size:32px; margin-bottom:8px;}
  .section-note{background:var(--info-tint); border:1px solid #C9E0F0; color:#265784; font-size:12px; padding:10px 14px; border-radius:8px; margin-bottom:14px;}
</style>
</head>
<body>
<button id="mobileMenuBtn" class="mobile-menu-btn no-print" onclick="toggleMobileSidebar()">☰</button>
<div id="sidebarBackdrop" class="sidebar-backdrop no-print" onclick="closeMobileSidebar()"></div>
<div id="app"><div class="loading-screen">Loading KKI Stores…</div></div>
<div id="toast" class="toast"></div>

<script>
/* =========================================================================
   K K INDUSTRIES — DIGITAL STORE MANAGEMENT SYSTEM
   Built on KKI-QMS-06 (Stores & Sales SOP, ISO 9001:2015)
   Single-file app. Persists via window.storage (personal, per-browser-account).
   ========================================================================= */

const STORAGE_KEY = 'kki_store_db_v2';
const MONTH_CODE = ['A','B','C','D','E','F','G','H','I','J','K','L']; // Jan..Dec per manual

let DB = null;
let ROUTE = 'dashboard';
let ROUTE_SUB = null;
let CURRENT_USER = null;

/* ---------- Default / empty DB shape ---------- */
function emptyDB(){
  return {
    materials: [], suppliers: [], customers: [], locations: [],
    batches: [], transactions: [],
    requisitions: [], issues: [], outwards: [], scraps: [], audits: [],
    returnables: [], salesOrders: [], purchaseOrders: [], drawings: [], productionPlans: [],
    seq: { material:0, supplier:0, customer:0, batch:0, inward:0, grn:0, req:0, issue:0, outward:0, scrap:0, audit:0, returnable:0, salesOrder:0, purchaseOrder:0, drawing:0, productionPlan:0 },
    identCounters: {},
    tagDefs: [
      {code:'green', label:'Green — Approved / Usable', desc:'Material inspected & accepted. Available for issue.'},
      {code:'yellow', label:'Yellow — Under Inspection / Hold', desc:'Awaiting QC decision. Not available for issue.'},
      {code:'red', label:'Red — Rejected / Blocked', desc:'Failed inspection or blocked. Cannot be issued or dispatched.'},
      {code:'blue', label:'Blue — Supplier Material', desc:'Identifies material sourced from a supplier (per KKI coding system).'},
      {code:'white', label:'White — Customer Material', desc:'Identifies material supplied by / belonging to a customer.'}
    ],
    settings:{ initialized:true, companyName:'K K INDUSTRIES', docRef:'KKI-QMS-06', gstin:'', stateName:'' }
  };
}

/* ---------- Persistence (server-backed, shared across all logged-in users) ---------- */
/* Fills in any fields missing from an older saved database (e.g. a section
   added in a later update) so existing accounts never crash when the app
   evolves. Always safe to run - never touches data that's already there. */
function migrateDB(db){
  const defaults = emptyDB();
  Object.keys(defaults).forEach(key=>{
    if(db[key]===undefined) db[key] = defaults[key];
  });
  if(db.seq && typeof db.seq === 'object'){
    Object.keys(defaults.seq).forEach(k=>{ if(db.seq[k]===undefined) db.seq[k] = defaults.seq[k]; });
  } else {
    db.seq = defaults.seq;
  }
  if(db.settings && typeof db.settings === 'object'){
    Object.keys(defaults.settings).forEach(k=>{ if(db.settings[k]===undefined) db.settings[k] = defaults.settings[k]; });
  } else {
    db.settings = defaults.settings;
  }
  if(!Array.isArray(db.tagDefs) || !db.tagDefs.length) db.tagDefs = defaults.tagDefs;
  return db;
}
async function loadDB(){
  try{
    const res = await fetch('/api/state');
    if(res.ok){
      const json = await res.json();
      if(json && json.data){ DB = migrateDB(JSON.parse(json.data)); return; }
    }
  }catch(e){ console.error('Load failed', e); }
  DB = emptyDB();
  await saveDB();
}
async function saveDB(){
  try{
    const res = await fetch('/api/state', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({data: JSON.stringify(DB)})
    });
    if(!res.ok) throw new Error('save failed: '+res.status);
  }catch(e){ console.error('Storage save failed', e); showToast('⚠ Could not save — check your connection'); }
}

/* Uploads a File object to the server, returns the new file's id (or null on failure/no file). */
function readFileAsBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function uploadFileToServer(file){
  if(!file) return null;
  const MAX_BYTES = 9*1024*1024;
  if(file.size > MAX_BYTES){ showToast('File too large — max ~9MB'); return null; }
  try{
    const base64 = await readFileAsBase64(file);
    const res = await fetch('/api/upload', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ filename: file.name, mimetype: file.type, data: base64 })
    });
    const j = await res.json();
    if(!res.ok || !j.ok){ showToast('⚠ File upload failed'); return null; }
    return j.id;
  }catch(e){ console.error('Upload failed', e); showToast('⚠ File upload failed'); return null; }
}

/* ---------- Seed a bit of realistic demo data so the system is not empty on first run ---------- */
function seedDemoData(){
  const sup1 = addSupplierRaw('Shree Paper Mills', 'MIDC, Kolhapur, MH', '27ABCDE1234F1Z5', 'R. Deshmukh', '9822011223', 'sales@shreepaper.in');
  const sup2 = addSupplierRaw('Vishal Chemicals & Adhesives', 'Kagal, Kolhapur, MH', '27PQRXY5678H1Z2', 'S. Patil', '9876543210', 'orders@vishalchem.in');
  const cus1 = addCustomerRaw('ABC Industries Pvt Ltd', 'Shiroli MIDC, Kolhapur', 'Mr. A. Kulkarni', '9922334455');
  addLocationRaw('Rack A', 'A-01'); addLocationRaw('Rack A', 'A-02'); addLocationRaw('Rack A', 'A-03');
  addLocationRaw('Rack B', 'B-01'); addLocationRaw('Rack B', 'B-02');
  addLocationRaw('Rack C', 'C-01');

/* ---------- Utility ---------- */
function uid(prefix, n){ return prefix + '-' + String(n).padStart(6,'0'); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ if(!d) return '—'; const dt = new Date(d+'T00:00:00'); if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function daysBetween(a,b){ const A=new Date(a+'T00:00:00'), B=new Date(b+'T00:00:00'); return Math.round((B-A)/86400000); }
function escapeHtml(s){ if(s===undefined||s===null) return ''; return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(window.__toastTimer); window.__toastTimer=setTimeout(()=>t.classList.remove('show'), 2600); }

function materialById(id){ return DB.materials.find(m=>m.id===id); }
function supplierById(id){ return DB.suppliers.find(s=>s.id===id); }
function customerById(id){ return DB.customers.find(c=>c.id===id); }
function locationById(id){ return DB.locations.find(l=>l.id===id); }
function batchById(id){ return DB.batches.find(b=>b.id===id); }

/* ---------- Identification number generator (per KKI-QMS-06 coding system: X&&/##/$ ) ---------- */
function nextIdentificationNo(dateStr, type){ // type: 'S' supplier or 'C' customer
  const d = new Date(dateStr+'T00:00:00');
  const monthLetter = MONTH_CODE[d.getMonth()];
  const yy = String(d.getFullYear()).slice(-2);
  const key = monthLetter+yy+type;
  DB.identCounters[key] = (DB.identCounters[key]||0) + 1;
  const serial = String(DB.identCounters[key]).padStart(2,'0');
  return { identNo: `${monthLetter}${yy}/${serial}/${type}`, serial: DB.identCounters[key] };
}

/* ---------- Stock helpers ---------- */
function currentStock(materialId){
  return DB.batches.filter(b=>b.materialId===materialId && b.tag==='green')
    .reduce((s,b)=>s+b.qtyRemaining,0);
}
function totalStockAllStatus(materialId){
  return DB.batches.filter(b=>b.materialId===materialId).reduce((s,b)=>s+b.qtyRemaining,0);
}
function usableBatchesFIFO(materialId){
  return DB.batches.filter(b=>b.materialId===materialId && b.tag==='green' && b.qtyRemaining>0)
    .sort((a,b)=> new Date(a.receivedDate) - new Date(b.receivedDate));
}
function logTxn({date, materialId, batchId, type, ref, qtyIn=0, qtyOut=0, remarks=''}){
  DB.transactions.push({
    id: DB.transactions.length+1, date, materialId, batchId, type, ref,
    qtyIn, qtyOut, balanceAfter: currentStock(materialId), remarks
  });
}

/* ---------- Core business operations ---------- */
function doInward(o, showMsg=true){
  const date = o.challanDate || todayISO();
  const { identNo } = nextIdentificationNo(date, o.sourceType);
  DB.seq.batch++; DB.seq.inward++; DB.seq.grn++;
  const grnNo = uid('GRN', DB.seq.grn);
  const expiryDate = o.expiryDate || (function(){
    const mat = materialById(o.materialId);
    if(mat && mat.expiryApplicable && mat.shelfLifeDays>0){
      const d = new Date(date+'T00:00:00'); d.setDate(d.getDate()+mat.shelfLifeDays);
      return d.toISOString().slice(0,10);
    }
    return '';
  })();
  const tag = o.inspectionStatus==='Accepted' ? 'green' : (o.inspectionStatus==='Rejected' ? 'red' : 'yellow');
  const batch = {
    id:'batch_'+DB.seq.batch, identNo, grnNo, inwardNo: uid('INW', DB.seq.inward),
    materialId:o.materialId, sourceType:o.sourceType, supplierId:o.sourceType==='S'?o.supplierId:'', customerId:o.sourceType==='C'?o.customerId:'',
    poNo:o.poNo||'', challanNo:o.challanNo||'', challanDate:date, receivedDate:date,
    qtyReceived:+o.qty, qtyRemaining:+o.qty, locationId:o.locationId||materialById(o.materialId)?.locationId||'',
    inspectionStatus:o.inspectionStatus||'Accepted', tag, expiryDate, remarks:o.remarks||''
  };
  DB.batches.push(batch);
  logTxn({date, materialId:o.materialId, batchId:batch.id, type:'Inward', ref:batch.inwardNo+' / GRN '+grnNo, qtyIn: (tag==='green'?+o.qty:0), remarks:'GRN generated, batch '+identNo});
  if(showMsg) showToast(`Inward saved — Identification No. ${identNo}`);
  return batch;
}

function fifoAllocate(materialId, qtyNeeded){
  const batches = usableBatchesFIFO(materialId);
  let remaining = qtyNeeded, plan=[];
  for(const b of batches){
    if(remaining<=0) break;
    const take = Math.min(b.qtyRemaining, remaining);
    if(take>0){ plan.push({batchId:b.id, identNo:b.identNo, qty:take, receivedDate:b.receivedDate}); remaining -= take; }
  }
  return { plan, shortfall: remaining };
}

function doIssue({requisitionId, items, issuedBy, date}){
  DB.seq.issue++;
  const issueNo = uid('ISS', DB.seq.issue);
  const record = { id:'iss_'+DB.seq.issue, issueNo, requisitionId: requisitionId||null, date: date||todayISO(), issuedBy: issuedBy||'Store Incharge', items:[] };
  items.forEach(it=>{
    const { plan, shortfall } = fifoAllocate(it.materialId, it.qty);
    plan.forEach(p=>{
      const b = batchById(p.batchId); b.qtyRemaining -= p.qty;
      logTxn({date: record.date, materialId: it.materialId, batchId:b.id, type:'Issue', ref:issueNo, qtyOut:p.qty, remarks:'FIFO issue'});
      record.items.push({materialId: it.materialId, batchId:b.id, identNo:b.identNo, qty:p.qty});
    });
    if(shortfall>0){ record.items.push({materialId: it.materialId, batchId:null, identNo:'—', qty:shortfall, shortfall:true}); }
  });
  DB.issues.push(record);
  if(requisitionId){ const r=DB.requisitions.find(r=>r.id===requisitionId); if(r) r.status='Issued'; }
  return record;
}

function fmtMoney(n){ n = +n||0; return '₹' + n.toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2}); }

/* ---------- Sales Order ---------- */
function computeSOTotals(items){
  let taxable = 0, gst = 0;
  items.forEach(it=>{
    const lineTaxable = (+it.qty||0) * (+it.rate||0);
    const lineGst = lineTaxable * ((+it.gstPct||0)/100);
    taxable += lineTaxable; gst += lineGst;
  });
  return { taxable, gst, grandTotal: taxable + gst };
}
function doCreateSalesOrder(o){
  DB.seq.salesOrder++;
  const soNo = uid('SO', DB.seq.salesOrder);
  const totals = computeSOTotals(o.items);
  const rec = {
    id:'so_'+DB.seq.salesOrder, soNo, date:o.date||todayISO(), customerId:o.customerId,
    customerPoNo:o.customerPoNo||'', deliveryDate:o.deliveryDate||'', paymentTerms:o.paymentTerms||'',
    items:o.items, remarks:o.remarks||'', status:'Open',
    taxable: totals.taxable, gst: totals.gst, grandTotal: totals.grandTotal
  };
  DB.salesOrders.push(rec);
  return rec;
}

/* ---------- Purchase Order ---------- */
function doCreatePurchaseOrder(o){
  DB.seq.purchaseOrder++;
  const poNo = uid('PO', DB.seq.purchaseOrder);
  const rec = {
    id:'po_'+DB.seq.purchaseOrder, poNo, date:o.date||todayISO(), supplierId:o.supplierId,
    linkedSalesOrderId:o.linkedSalesOrderId||'', expectedDeliveryDate:o.expectedDeliveryDate||'',
    items: o.items.map(it=>({...it, receivedQty:0})), remarks:o.remarks||'', status:'Open'
  };
  DB.purchaseOrders.push(rec);
  return rec;
}
function poPending(po){ return po.items.reduce((sum,it)=>sum+Math.max(0, it.qty-it.receivedQty), 0); }
function recomputePOStatus(po){
  const pending = poPending(po);
  const totalReceived = po.items.reduce((s,it)=>s+it.receivedQty,0);
  po.status = pending<=0 ? 'Closed' : (totalReceived>0 ? 'Partially Received' : 'Open');
}
/* Called from Inward when material is received "against" an open PO */
function applyInwardToPO(poId, materialId, qty){
  const po = DB.purchaseOrders.find(p=>p.id===poId);
  if(!po) return null;
  const line = po.items.find(it=>it.materialId===materialId && it.receivedQty<it.qty);
  if(!line) return null;
  const applied = Math.min(qty, line.qty - line.receivedQty);
  line.receivedQty += applied;
  recomputePOStatus(po);
  return po;
}

function doOutward(o){
  DB.seq.outward++;
  const dcNo = uid('DC', DB.seq.outward);
  const record = { id:'out_'+DB.seq.outward, dcNo, customerId:o.customerId, date:o.date||todayISO(),
    vehicle:o.vehicle||'', driver:o.driver||'', destination:o.destination||'', remarks:o.remarks||'', items:[] };
  o.items.forEach(it=>{
    const { plan, shortfall } = fifoAllocate(it.materialId, it.qty);
    plan.forEach(p=>{
      const b = batchById(p.batchId); b.qtyRemaining -= p.qty;
      logTxn({date:record.date, materialId:it.materialId, batchId:b.id, type:'Outward', ref:dcNo, qtyOut:p.qty, remarks:'Dispatch'});
      record.items.push({materialId:it.materialId, batchId:b.id, identNo:b.identNo, qty:p.qty});
    });
    if(shortfall>0) record.items.push({materialId:it.materialId, batchId:null, identNo:'—', qty:shortfall, shortfall:true});
  });
  DB.outwards.push(record);
  return record;
}

function doScrap(o){
  DB.seq.scrap++;
  const scrapNo = uid('SCR', DB.seq.scrap);
  const b = o.batchId ? batchById(o.batchId) : null;
  if(b){ b.qtyRemaining = Math.max(0, b.qtyRemaining - o.qty); }
  const rec = { id:'scr_'+DB.seq.scrap, scrapNo, date:o.date||todayISO(), materialId:o.materialId, batchId:o.batchId||null,
    identNo: b?b.identNo:'—', qty:o.qty, reason:o.reason, department:o.department||'', approvedBy:o.approvedBy||'', disposalMethod:o.disposalMethod||'' };
  DB.scraps.push(rec);
  logTxn({date:rec.date, materialId:o.materialId, batchId:o.batchId, type:'Scrap', ref:scrapNo, qtyOut:o.qty, remarks:o.reason});
  return rec;
}

/* ---------- Returnable Challan (Job Work) ---------- */
function doSendJobWork(o){
  DB.seq.returnable++;
  const rcNo = uid('RC', DB.seq.returnable);
  const { plan } = fifoAllocate(o.materialId, o.qty);
  const usedBatches = [];
  plan.forEach(p=>{
    const b = batchById(p.batchId); b.qtyRemaining -= p.qty;
    logTxn({date:o.dateSent, materialId:o.materialId, batchId:b.id, type:'Job Work Out', ref:o.challanNo||rcNo, qtyOut:p.qty, remarks:`Sent to job worker${o.process?' for '+o.process:''}`});
    usedBatches.push({batchId:b.id, identNo:b.identNo, qty:p.qty});
  });
  const rec = {
    id:'rc_'+DB.seq.returnable, rcNo, challanNo:o.challanNo||'', materialId:o.materialId, supplierId:o.supplierId,
    process:o.process||'', qtySent:+o.qty, qtyReceived:0, qtyShortage:0,
    dateSent:o.dateSent||todayISO(), expectedReturnDate:o.expectedReturnDate||'',
    status:'Sent', remarks:o.remarks||'', usedBatches, receipts:[]
  };
  DB.returnables.push(rec);
  return rec;
}
function returnablePending(r){ return r.qtySent - r.qtyReceived - r.qtyShortage; }
function doReceiveJobWork(returnableId, o){
  const r = DB.returnables.find(x=>x.id===returnableId);
  if(!r) return null;
  const qtyNow = +o.qtyReceivedNow||0;
  const shortageNow = +o.shortageQty||0;
  const date = o.date||todayISO();
  let newBatch = null;
  if(qtyNow>0){
    newBatch = doInward({
      materialId:r.materialId, supplierId:r.supplierId, sourceType:'S',
      challanNo: r.challanNo || r.rcNo, challanDate:date, qty:qtyNow,
      inspectionStatus:'Pending Inspection',
      remarks:`Returned from job work — ${r.rcNo}${r.process?' ('+r.process+')':''}. Re-inspection required before use.`
    }, false);
  }
  r.qtyReceived += qtyNow;
  r.qtyShortage += shortageNow;
  r.receipts.push({date, qty:qtyNow, shortageQty:shortageNow, shortageReason:o.shortageReason||'', remarks:o.remarks||'', newBatchId:newBatch?newBatch.id:null});
  r.status = returnablePending(r)<=0 ? 'Closed' : 'Partially Received';
  return r;
}

/* ---------- shared UI builders ---------- */
function pageHead(title, desc, actionHtml){
  return `<div class="topbar"><div><h1>${title}</h1><div class="desc">${desc}</div></div><div>${actionHtml||''}</div></div>`;
}
function emptyState(msg, icon){
  return `<div class="empty-state"><div class="big">${icon||'—'}</div>${msg}</div>`;
}
function modal(title, bodyHtml, footHtml, id){
  const wrap = document.createElement('div');
  wrap.className='overlay'; wrap.id = id||'modalOverlay';
  wrap.innerHTML = `<div class="modal">
    <div class="modal-head"><h3>${title}</h3><button class="modal-close" onclick="closeModal('${id||'modalOverlay'}')">&times;</button></div>
    <div class="modal-body">${bodyHtml}</div>
    <div class="modal-foot">${footHtml}</div>
  </div>`;
  wrap.addEventListener('click', e=>{ if(e.target===wrap) closeModal(id||'modalOverlay'); });
  document.body.appendChild(wrap);
}
function closeModal(id){ const m = document.getElementById(id||'modalOverlay'); if(m) m.remove(); }
function val(id){ const el=document.getElementById(id); return el ? el.value : ''; }
function checked(id){ const el=document.getElementById(id); return el ? el.checked : false; }

function tagPill(tag){
  const def = DB.tagDefs.find(t=>t.code===tag);
  const label = tag ? tag.charAt(0).toUpperCase()+tag.slice(1) : '—';
  return `<span class="tag ${tag}"><span class="dot ${tag}"></span>${label}</span>`;
}
function optionsFor(list, valueKey, labelFn, selected){
  return list.map(x=>`<option value="${x[valueKey]}" ${x[valueKey]===selected?'selected':''}>${escapeHtml(labelFn(x))}</option>`).join('');
}

function materialDedupeKey(m){
  if(m.partNo) return 'P:'+String(m.partNo).trim().toLowerCase();
  return 'N:'+String(m.name||'').trim().toLowerCase()+'|'+String(m.extrusionNo||'').trim().toLowerCase()+'|'+String(m.rmSpec||'').trim().toLowerCase();
}
/* Shared import engine — used by both the built-in legacy dataset and the Upload Excel feature */
function importMaterialRows(rows){
  let addedMat=0, skippedMat=0, addedSup=0;
  const supplierCache = {};
  DB.suppliers.forEach(s=> supplierCache[s.name.trim().toLowerCase()] = s);
  function ensureSupplier(name){
    if(!name) return '';
    const key = String(name).trim().toLowerCase();
    if(supplierCache[key]) return supplierCache[key].id;
    const s = addSupplierRaw(String(name).trim(), '', '', '', '', '');
    supplierCache[key] = s; addedSup++;
    return s.id;
  }
  const existingKeys = new Set(DB.materials.map(materialDedupeKey));
  rows.forEach(r=>{
    if(!r.name && !r.partNo) return;
    const key = materialDedupeKey(r);
    if(existingKeys.has(key)){ skippedMat++; return; }
    const supplierId = ensureSupplier(r.supplierName);
    addMaterialRaw({
      name:r.name||r.partNo, category:r.category||'Raw Material', spec:r.rmSpec||'', unit:'PCS',
      supplierId, partNo:r.partNo, extrusionNo:r.extrusionNo, rmSpec:r.rmSpec,
      cuttingLengthMm:r.cuttingLengthMm, rmWeightKg:r.rmWeightKg,
      totalCuttingLength:r.totalCuttingLength, rmRequiredKg:r.rmRequiredKg
    });
    existingKeys.add(key);
    addedMat++;
  });
  DB.settings.legacyRMImported = true;
  saveDB();
  return { addedMat, skippedMat, addedSup };
}

const EXCEL_FIELD_CANDIDATES = {
  partNo: ['partnumber','partno'],
  name: ['partname','materialname','name','itemname'],
  category: ['rm','category','materialtype','rawmaterial'],
  rmSpec: ['rmspecifications','rmspecification','specification','spec','materialspecification'],
  extrusionNo: ['extrusionnumber','extrusionno'],
  cuttingLengthMm: ['cuttinglengthinmm','cuttinglength','cuttinglengthmm'],
  rmWeightKg: ['rmweight','weight'],
  totalCuttingLength: ['totalcuttinglength'],
  rmRequiredKg: ['rmrequiredinkg','rmrequired'],
  supplierName: ['suppliername','supplier','materialsupplier'],
};
function normHeader(h){ return String(h).toLowerCase().replace(/[^a-z0-9]/g,''); }
function mapExcelRow(row){
  const normMap = {};
  Object.keys(row).forEach(k=> normMap[normHeader(k)] = row[k]);
  const out = {};
  Object.entries(EXCEL_FIELD_CANDIDATES).forEach(([field, cands])=>{
    let v = '';
    for(const c of cands){ if(normMap[c]!==undefined && String(normMap[c]).trim()!==''){ v = String(normMap[c]).trim(); break; } }
    out[field] = v;
  });
  return out;
}
let PENDING_IMPORT_ROWS = [];
function triggerExcelUpload(){ document.getElementById('excelUploadInput').click(); }
async function handleExcelUpload(e){
  const file = e.target.files[0]; e.target.value=''; if(!file) return;
  try{
    const data = await file.arrayBuffer();
    const wb = XLSX.read(data, {type:'array'});
    const sheetName = wb.SheetNames.find(n=>n.trim().toLowerCase()==='rm') || wb.SheetNames[0];
    const json = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {defval:''});
    const rows = json.map(mapExcelRow).filter(r=>r.name || r.partNo);
    if(!rows.length){ showToast('No usable rows found in "'+sheetName+'" — check column headers'); return; }
    PENDING_IMPORT_ROWS = rows;
    showImportPreview(sheetName, rows);
  }catch(err){ console.error(err); showToast('⚠ Could not read that file — is it a valid .xlsx/.csv?'); }
}
function showImportPreview(sheetName, rows){
  modal(`Preview Import — ${rows.length} row(s) found`, `
    <div class="muted" style="margin-bottom:8px;">Reading sheet "<b>${escapeHtml(sheetName)}</b>". Showing first 10 rows — review before confirming.</div>

    <table><thead><tr><th>Part No</th><th>Name</th><th>Category</th><th>Extrusion No</th><th>RM Spec</th><th>Supplier</th></tr></thead>
    <tbody>${rows.slice(0,10).map(r=>`<tr>
      <td class="mono">${escapeHtml(r.partNo||'—')}</td><td>${escapeHtml(r.name||'—')}</td><td>${escapeHtml(r.category||'—')}</td>
      <td class="mono">${escapeHtml(r.extrusionNo||'—')}</td><td>${escapeHtml(r.rmSpec||'—')}</td><td>${escapeHtml(r.supplierName||'—')}</td>
    </tr>`).join('')}</tbody></table>
    </div>
  `, `<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="confirmExcelImport()">Import ${rows.length} row(s)</button>`);
}

function deleteMaterial(id){
  const m = materialById(id);
  if(!m) return;
  const hasTxns = DB.transactions.some(t=>t.materialId===id) || DB.batches.some(b=>b.materialId===id);
  const warn = hasTxns
    ? `\n\n⚠ This material has stock/transaction history (inward, issues, or batches). Deleting it will NOT delete those records, but they will show a missing material reference. Only delete if this was test/sample data.`
    : '';
  if(!confirm(`Delete "${m.name}" (${m.code}) from Material Master? This cannot be undone.${warn}`)) return;
  DB.materials = DB.materials.filter(x=>x.id!==id);
  saveDB();
  showToast(`Deleted "${m.name}"`);
  renderMaterials(document.getElementById('main'));
}

function changeBatchTag(batchId, newTag){
  if(!newTag) return;
  const b = DB.batches.find(x=>x.id===batchId);
  if(!b) return;
  const oldTag = b.tag;
  if(oldTag === newTag) return;
  b.tag = newTag;
  b.inspectionStatus = inspectionLabelFromTag(newTag);
  logTxn({
    date: todayISO(), materialId: b.materialId, batchId: b.id, type: 'Tag Change', ref: b.identNo,
    remarks: `Tag changed from ${oldTag} to ${newTag}`
  });
  saveDB();
  const label = newTag==='green' ? 'marked Inspected (Green) — now available as stock' : `tag changed to ${newTag}`;
  showToast(`${b.identNo}: ${label}`);
  notifyPush('Tag Updated', `${b.identNo} (${materialById(b.materialId)?.name||''}) — ${label}`);
  render();
}

function populateInwardPOLink(){
  const sel = document.getElementById('in_po_link');
  if(!sel) return;
  const supplierId = val('in_supplier');
  const openPOs = DB.purchaseOrders.filter(p=>p.status!=='Closed' && (!supplierId || p.supplierId===supplierId));
  sel.innerHTML = `<option value="">— None / not against a system PO —</option>` +
    openPOs.map(p=>{
      const summary = p.items.map(it=>{
        const m = materialById(it.materialId);
        const pending = Math.max(0, it.qty - it.receivedQty);
        return `${m?m.name:'?'} (${pending} pending)`;
      }).join(', ');
      return `<option value="${p.id}">${p.poNo} — ${supplierById(p.supplierId)?.name||''} — ${summary}</option>`;
    }).join('');

function onInwardPOLinkChange(){
  const po = DB.purchaseOrders.find(p=>p.id===val('in_po_link'));
  const box = document.getElementById('in_po_details');
  if(po){

    if(box){
      box.style.display = '';
      box.innerHTML = `<b>Items on ${po.poNo}:</b><br>` + po.items.map(it=>{
        const m = materialById(it.materialId);
        const pending = Math.max(0, it.qty - it.receivedQty);
        return `${m?escapeHtml(m.name):'?'} — ordered ${it.qty}, received ${it.receivedQty}, <b>${pending} still pending</b>`;
      }).join('<br>');
    }
  } else if(box){
    box.style.display = 'none';
    box.innerHTML = '';
  }
}

function submitInward(){
  const sourceType = document.querySelector('input[name=src]:checked').value;
  const materialId = val('in_material');
  const qty = +val('in_qty');
  const challan = val('in_challan').trim();
  if(!materialId){ showToast('Select a material'); return; }
  if(!qty || qty<=0){ showToast('Enter a valid quantity'); return; }
  if(!challan){ showToast('Challan No. is required'); return; }
  if(sourceType==='S' && !val('in_supplier')){ showToast('Select a supplier'); return; }
  if(sourceType==='C' && !val('in_customer')){ showToast('Select a customer'); return; }
  const batch = doInward({
    materialId, sourceType, supplierId: val('in_supplier'), customerId: val('in_customer'),
    poNo: val('in_po'), challanNo: challan, challanDate: val('in_date')||todayISO(),
    qty, locationId: val('in_loc'), inspectionStatus: document.querySelector('input[name=insp]:checked').value,

  main.innerHTML = pageHead('Expiry / Shelf-life Management', 'Per KKI-QMS-06: Store Incharge assigns and controls expiration dates.') +
    `<div class="grid cards3" style="margin-bottom:16px;">

    </div>
    <div class="panel"><div class="panel-body" style="padding:0;">
      <table><thead><tr><th>Ident. No.</th><th>Material</th><th class="num">Qty Remaining</th><th>Expiry Date</th><th>Days Left</th><th>Status</th></tr></thead>

          <td class="num">${b.qtyRemaining}</td><td>${fmtDate(b.expiryDate)}</td><td>${d<0?'Expired':d+' days'}</td><td>${status}</td></tr>`;

    </div></div>`;

function openIssueForRequisition(reqId){
  const r = DB.requisitions.find(x=>x.id===reqId);
  let rows = r.items.map(it=>{
    const m = materialById(it.materialId); const {plan, shortfall} = fifoAllocate(it.materialId, it.qty);
    return `<tr><td>${escapeHtml(m.name)}</td><td class="num">${it.qty} ${m.unit}</td>
      <td class="num">${currentStock(it.materialId)} ${m.unit}</td>
      <td>${plan.map(p=>`<span class="ident-badge" style="margin-right:4px;">${p.identNo}</span>×${p.qty}`).join(' ')}${shortfall>0?` <span style="color:var(--danger);font-weight:700;">Short by ${shortfall}</span>`:''}</td></tr>`;
  }).join('');
  modal(`Issue Material — ${r.reqNo}`, `
    <div class="kv" style="margin-bottom:12px;"><div class="k">Department</div><div class="v">${escapeHtml(r.department)}</div>
      <div class="k">Job No.</div><div class="v">${escapeHtml(r.jobNo||'—')}</div></div>
    <table><thead><tr><th>Material</th><th class="num">Requested</th><th class="num">Available</th><th>FIFO Allocation</th></tr></thead>

  `, `<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="confirmIssue('${reqId}')">Confirm Issue</button>`);
}
function confirmIssue(reqId){
  const r = DB.requisitions.find(x=>x.id===reqId);
  const errors = [];
  r.items.forEach(it=>{
    const { shortfall } = fifoAllocate(it.materialId, it.qty);
    if(shortfall>0){
      const name = materialById(it.materialId)?.name || 'Material';
      const avail = currentStock(it.materialId);
      errors.push(`${name}: only ${avail} available, requisition asks for ${it.qty}`);
    }
  });
  if(errors.length){
    showToast(`⚠ Not enough stock to issue — ${errors.join('; ')}`);
    return;
  }
  const rec = doIssue({ requisitionId:reqId, items: r.items, issuedBy: val('iss_by'), date: todayISO() });
  saveDB(); closeModal();
  showToast(`Issued — ${rec.issueNo}`);
  notifyPush('Material Issued', `${rec.issueNo} issued to ${r.department||'Production'}`);
  navigate('issues');
}

function submitOutward(){

  const items = rows.map(r=>({materialId:r.querySelector('.ow-mat').value, qty:+r.querySelector('.ow-qty').value})).filter(i=>i.materialId&&i.qty>0);
  if(!items.length){ showToast('Add at least one material with quantity'); return; }

  const errors = [];
  items.forEach(it=>{
    const avail = currentStock(it.materialId);
    if(it.qty > avail){
      const name = materialById(it.materialId)?.name || 'Material';
      errors.push(`${name}: only ${avail} available, you entered ${it.qty}`);
    }
  });
  if(errors.length){
    showToast(`⚠ Not enough stock — ${errors.join('; ')}`);

function openReceiveJobWork(rcId){
  const r = DB.returnables.find(x=>x.id===rcId);

  const pending = returnablePending(r);
  const mat = materialById(r.materialId);
  modal(`Receive Back — ${r.rcNo}`, `

    </div>

    </div>

      <select id="rcv_reason">
        <option value="">— None —</option>
        <option value="Rejected by QC">Rejected by QC</option>
        <option value="Lost in Process">Lost in Process</option>
        <option value="Damaged in Transit">Damaged in Transit</option>

      </select>
    </div>

  `, `<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="confirmReceiveJobWork('${rcId}')">Confirm Receipt</button>`);
}
function confirmReceiveJobWork(rcId){
  const r = DB.returnables.find(x=>x.id===rcId);
  if(!r) return;
  const pending = returnablePending(r);
  const qtyNow = +val('rcv_qty')||0;
  const shortageNow = +val('rcv_short')||0;
  if(qtyNow<0 || shortageNow<0){ showToast('Quantities cannot be negative'); return; }
  if(qtyNow + shortageNow <= 0){ showToast('Enter a received quantity or a shortage quantity'); return; }
  if(qtyNow + shortageNow > pending){ showToast(`⚠ That's more than what's still pending (${pending} remaining)`); return; }
  doReceiveJobWork(rcId, { qtyReceivedNow: qtyNow, shortageQty: shortageNow, shortageReason: val('rcv_reason'), remarks: val('rcv_remarks') });
  saveDB(); closeModal();
  const updated = DB.returnables.find(x=>x.id===rcId);
  showToast(updated.status==='Closed' ? `${updated.rcNo} fully received — Closed` : `${updated.rcNo} partially received — ${returnablePending(updated)} still pending`);
  notifyPush('Job Work Received', `${updated.rcNo} — ${qtyNow} received back${shortageNow?`, ${shortageNow} shortage`:''} (${updated.status})`);
  navigate('returnable-register');
}

async function submitDrawing(){
  const drawingNo = val('dwg_no').trim();
  if(!drawingNo){ showToast('Enter a Drawing Number'); return; }
  const btn = document.getElementById('dwg_submit_btn');
  const fileInput = document.getElementById('dwg_file');
  const file = fileInput.files[0] || null;
  btn.disabled = true; btn.textContent = file ? 'Uploading…' : 'Saving…';
  let fileId = null;
  if(file){
    fileId = await uploadFileToServer(file);
    if(fileId===null && file){ btn.disabled=false; btn.textContent='Save Drawing'; return; }

  const rec = doCreateDrawing({
    drawingNo, materialId: val('dwg_mat'), fileId, fileName: file?file.name:'', remarks: val('dwg_remarks')

  saveDB();
  showToast(`Drawing saved — ${rec.drawingNo}`);

function productionActionsHtml(p){
  if(p.status==='Completed') return '—';
  const opts = [];
  if(p.status==='Not Started') opts.push(`<button class="link-btn" onclick="updateProductionStatus('${p.id}','In Progress')">Start →</button>`);
  if(p.status==='In Progress') opts.push(`<button class="link-btn" onclick="openCompleteProduction('${p.id}')">Complete →</button>`);
  if(p.status!=='On Hold') opts.push(`<button class="link-btn" style="color:var(--danger);" onclick="updateProductionStatus('${p.id}','On Hold')">Hold</button>`);
  else opts.push(`<button class="link-btn" onclick="updateProductionStatus('${p.id}','In Progress')">Resume</button>`);
  return opts.join(' · ');
}
function updateProductionStatus(id, newStatus){
  const p = DB.productionPlans.find(x=>x.id===id);
  if(!p) return;
  p.status = newStatus;
  saveDB();
  showToast(`${p.planNo}: ${newStatus}`);
  notifyPush('Production Update', `${p.planNo} (${materialById(p.materialId)?.name||''}) — ${newStatus}`);
  renderProductionRegister(document.getElementById('main'));
}
function openCompleteProduction(id){
  const p = DB.productionPlans.find(x=>x.id===id);
  if(!p) return;
  modal(`Complete — ${p.planNo}`, `
    <div class="field"><label>Actual Quantity Produced</label><input id="pp_actual" type="number" min="0" value="${p.plannedQty}"></div>

  `, `<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="confirmCompleteProduction('${id}')">Mark Completed</button>`);
}
function confirmCompleteProduction(id){
  const p = DB.productionPlans.find(x=>x.id===id);
  if(!p) return;
  const actual = +val('pp_actual')||0;
  p.actualQty = actual;
  p.status = 'Completed';
  saveDB(); closeModal();
  showToast(`${p.planNo}: Completed — ${actual} produced`);
  notifyPush('Production Completed', `${p.planNo} (${materialById(p.materialId)?.name||''}) — ${actual} produced`);

}

function submitAudit(){

function inspectionLabelFromTag(tag){

          <div class="k">Material</div><div class="v">${escapeHtml(mat.name)} (${mat.code})</div>
          <div class="k">Received</div><div class="v">${fmtDate(batch.receivedDate)} — Qty ${batch.qtyReceived} ${mat.unit}</div>
          <div class="k">Remaining</div><div class="v">${batch.qtyRemaining} ${mat.unit}</div>
          <div class="k">Current Tag</div><div class="v">${tagPill(batch.tag)}</div>
        </div>
      </div>
    </div>
    <div class="grid cards3">
      <div class="panel"><div class="panel-head"><h3>Material Issues</h3></div><div class="panel-body">
        ${issuesUsing.length? issuesUsing.map(i=>{ const it=i.items.find(x=>x.batchId===batch.id);
          return `<div style="padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px;">${i.issueNo} — ${fmtDate(i.date)} — ${it.qty} ${mat.unit}</div>`;

        ${outwardsUsing.length? outwardsUsing.map(o=>{ const it=o.items.find(x=>x.batchId===batch.id);
          return `<div style="padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px;">${o.dcNo} — ${fmtDate(o.date)} — ${escapeHtml(customerById(o.customerId)?.name||'')} — ${it.qty} ${mat.unit}</div>`;

      <div class="panel"><div class="panel-head"><h3>Scrap</h3></div><div class="panel-body">

function renderReports(main){
  main.innerHTML = pageHead('Reports', 'All registers generated automatically from live data. Export any report as CSV/Excel.') +
    `<div class="grid cards3">` +
    REPORT_DEFS.map(r=>`<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <b style="font-size:13px;">${r.label}</b>
        <button class="btn ghost sm" onclick='downloadReport("${r.id}")'>⬇ CSV</button>
      </div>
      <div class="muted" style="font-size:12px;margin-top:6px;">${(r.get()||[]).length} rows</div>
    </div>`).join('') + `</div>`;

function downloadReport(id){
  const def = REPORT_DEFS.find(r=>r.id===id); const data = def.get();
  if(!data.length){ showToast('No data to export yet'); return; }
  const headers = Object.keys(data[0]);
  const rows = [headers, ...data.map(d=>headers.map(h=>d[h]))];
  exportCSV(rows, def.label.replace(/\s+/g,'_')+'.csv');
}
function exportCSV(rows, filename){
  const csv = rows.map(r=>r.map(c=>{
    const s = String(c===undefined||c===null?'':c);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click(); URL.revokeObjectURL(url);
  showToast('Downloaded '+filename);
}

function showLoginScreen(msg){
  document.getElementById('app').innerHTML = `
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:var(--bg);">
      <div style="width:320px;padding:30px;border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:0 8px 30px rgba(0,0,0,.08);">
        <div style="font-weight:700;font-size:16px;">K K INDUSTRIES</div>

        ${msg?`<div style="color:var(--danger);font-size:12.5px;margin-bottom:12px;">${escapeHtml(msg)}</div>`:''}
        <div class="field"><label>Username</label><input id="loginUser" autocomplete="username" onkeydown="if(event.key==='Enter')doLogin()"></div>
        <div class="field"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
        <button class="btn primary" style="width:100%;margin-top:10px;" onclick="doLogin()">Sign in</button>
      </div>
    </div>`;
  const u = document.getElementById('loginUser'); if(u) u.focus();
}
async function doLogin(){
  const username = (document.getElementById('loginUser').value||'').trim();
  const password = document.getElementById('loginPass').value||'';
  if(!username || !password){ showLoginScreen('Enter username and password'); return; }
  let res;
  try{
    res = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username,password})});
  }catch(e){
    console.error('Login network error', e);
    showLoginScreen('Could not reach server — is it running?');
    return;
  }
  if(!res.ok){ showLoginScreen('Invalid username or password'); return; }
  try{
    const j = await res.json();
    CURRENT_USER = j.username || username;
    await loadDB();
    showLanding();
  }catch(e){
    console.error('Error after login (loading/rendering data)', e);
    showLoginScreen('Signed in, but something went wrong loading the app — check browser console (F12) and tell support the error shown there.');
  }
}
async function doLogout(){
  try{ await fetch('/api/logout', {method:'POST'}); }catch(e){}
  CURRENT_USER = null; DB = null;
  showLoginScreen();
}
async function checkSessionAndBoot(){
  let res, j;
  try{
    res = await fetch('/api/session');
    j = await res.json();
  }catch(e){
    console.error('Session check network error', e);
    showLoginScreen('Could not reach server — is it running?');
    return;
  }
  if(j && j.logged_in){
    CURRENT_USER = j.username;
    try{
      await loadDB();
      showLanding();
    }catch(e){
      console.error('Error loading/rendering after session check', e);
      showLoginScreen('Signed in, but something went wrong loading the app — check browser console (F12) and tell support the error shown there.');
    }
  } else {
    showLoginScreen();
  }
}

/* ================= PUSH NOTIFICATIONS ================= */
function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for(let i=0; i<rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}
function pushSupported(){
  return 'serviceWorker' in navigator && 'PushManager' in window;
}
async function isPushSubscribed(){
  if(!pushSupported()) return false;
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  return !!sub;
}
async function enablePushNotifications(){
  if(!pushSupported()){ showToast('Push notifications are not supported in this browser'); return; }
  try{
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){ showToast('Notifications permission was not granted'); return; }
    const keyRes = await fetch('/api/push/vapid-public-key');
    const { key } = await keyRes.json();
    if(!key){ showToast('Push is not configured on the server yet'); return; }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(key)
    });
    await fetch('/api/push/subscribe', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(sub)
    });
    showToast('Notifications enabled on this device');
    updateNotifBellUI();
  }catch(e){
    console.error('Push subscribe failed', e);
    showToast('Could not enable notifications — see console for details');
  }
}
async function disablePushNotifications(){
  try{
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if(sub){
      await fetch('/api/push/unsubscribe', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ endpoint: sub.endpoint })
      });
      await sub.unsubscribe();
    }
    showToast('Notifications turned off on this device');
    updateNotifBellUI();
  }catch(e){ console.error('Push unsubscribe failed', e); }
}
async function toggleNotifications(){
  if(await isPushSubscribed()) await disablePushNotifications();
  else await enablePushNotifications();
}
async function updateNotifBellUI(){
  const btn = document.getElementById('notifBellBtn');
  if(!btn) return;
  const on = await isPushSubscribed();
  btn.textContent = on ? '🔔 Notifications On' : '🔕 Enable Notifications';
  btn.classList.toggle('active-bell', on);
}
/* Fire-and-forget: tells the server to push this to every subscribed device.
   Called right after any stock-affecting action. Never blocks the UI on failure. */
function notifyPush(title, body){
  fetch('/api/push/send', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ title, body })
  }).catch(e=>console.error('Push send failed', e));
}
